services:
  9router:
    image: decolua/9router:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 9router
    restart: always
    init: true
    ports:
      - "20128:20128"
    volumes:
      # Option 1 (Recommended): Mount local user data (~/.9router) to persist config & DB
      - ${HOME}/.9router:/app/data
      # Option 2 (Project-local data directory):
      # - ./data:/app/data
      # Option 3 (Docker named volume):
      # - 9router-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Optional named volume if not using host bind-mount
# volumes:
#   9router-data:
#     name: 9router-data
